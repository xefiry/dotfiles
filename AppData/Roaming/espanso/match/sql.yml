matches:
  # Dates
  - trigger: "$sd"
    replace: "SYSDATE"

  - trigger: "$tsd"
    replace: "TRUNC(SYSDATE)"

  - trigger: "$tr"
    replace: "TRUNC($|$)"

  - trigger: "$t="
    replace: "TRUNC($|$) = TRUNC(SYSDATE)"

  - trigger: "$td1"
    replace: "TO_DATE('$|$', 'DD/MM/YYYY')"

  - trigger: "$td2"
    replace: "TO_DATE('$|$', 'YYYY-MM-DD')"

  - trigger: "$tdh"
    replace: "TO_DATE('$|$', 'DD/MM/YYYY HH24:MI:SS')"

  - trigger: "$tc1"
    replace: "TO_CHAR($|$, 'DD/MM/YYYY')"

  - trigger: "$tc2"
    replace: "TO_CHAR($|$, 'YYYY-MM-DD')"

  - trigger: "$tch"
    replace: "TO_CHAR($|$, 'DD/MM/YYYY HH24:MI:SS')"

  # Key words
  - trigger: "$gb"
    replace: "GROUP BY"

  - trigger: "$dis"
    replace: "DISTINCT"

  - trigger: "$ob"
    replace: "ORDER BY"

  - trigger: "$ua"
    replace: "UNION ALL"

  - trigger: "$j"
    replace: "JOIN"

  - trigger: "$lj"
    replace: "LEFT JOIN"

  - trigger: "$w"
    replace: "WHERE"

  # SELECT expressions
  - trigger: "s*f"
    replace: "SELECT * FROM"

  - trigger: "$sfd"
    replace: "SELECT $|$ FROM dual"

  - trigger: "$scf"
    replace: "SELECT COUNT(*) FROM"

  - trigger: "$sis"
    replace: "SELECT DISTINCT $|$ FROM"

  # Misc expressions
  - trigger: "$cnt"
    replace: "COUNT(*)"

  - trigger: "$hc"
    replace: "HAVING COUNT(*) > 1"

  - trigger: "$pl"
    replace: "dbms_output.put_line($|$);"

  - trigger: "$nl"
    replace: "dbms_output.new_line;"

  - trigger: "$tab"
    replace: "-- tab ="

  - trigger: "$list"
    replace: "LISTAGG($|$, '; ') WITHIN GROUP (ORDER BY xxx)"
